# sweep_v2.yaml
#
# WandB Bayesian Sweep per il PosController — OBIETTIVO GLOBALE.
#
# METRICA OBIETTIVO: Objective/composite_target
#   = obj_w_err     * error_mean            (globale, tutti gli env)
#   + obj_w_smooth  * smoothness_mean       (globale, tutti gli env)
#   + obj_w_rev     * reverse_uniciclo_mean (solo uniciclo)
#   + obj_w_vy_ref  * vy_ref_uniciclo_mean  (solo uniciclo)
#   + obj_w_vy_real * vy_real_uniciclo_mean (solo uniciclo)
#   (loggata dall'env in extras["Objective/composite_target"], vedi _reset_idx
#   in pos_controller_env.py). I pesi obj_* sono FISSI nel cfg, non sweeppati.
#
# PERIMETRO DELLO SWEEP: il modello e' gia' considerato buono. Questo sweep
#   esplora SOLO i pesi della reward che modellano le 5 componenti
#   dell'obiettivo (errore, smoothness, retromarcia, vy ref, vy reale), con
#   range STRETTI (circa +-30-40%) centrati sui valori di default attuali
#   del cfg. PPO e architettura di rete NON sono sweeppati in questa
#   versione: restano quelli gia' configurati in agent_cfg (skrl_cfg_entry_point),
#   perche' si vuole isolare l'effetto della reward shape, non rimescolare
#   anche l'ottimizzazione/l'architettura.
#
# COMPONENTI DELL'OBIETTIVO E LORO CSV: a fine ogni trial, train_manual.py
#   carica su wandb (come Artifact, nessun file sull'host) 6 CSV — uno per
#   ciascuna componente grezza (error_mean, smoothness_mean,
#   reverse_uniciclo_mean, vy_ref_uniciclo_mean, vy_real_uniciclo_mean) piu'
#   uno per il composite_target — con lo storico per-reset dell'intero
#   training di quel trial.
#
# NOTA: dof_mask_set / dof_mask_probs NON sono sweeppabili qui (sono tuple,
#   non scalari). Restano fissi al default in MyDronePosEnvCfg:
#     dof_mask_set   = ([1,1,1,1], [1,0,1,1])   # full, uniciclo
#     dof_mask_probs = (0.50, 0.50)

entity: pieromutasci-politecnico-di-bari
project: tuning-position-controller
program: /workspace/project_workspace/Project_Favuzzi_Mutasci/scripts/skrl/train_sweep.py
name: POS_SWEEP_GLOBAL_V1
method: bayes
metric:
  name: "Objective/composite_target"
  goal: minimize

parameters:

  # ===================================================================
  # DURATA DEL TRIAL (fissa per confrontare a parita' di budget)
  # ===================================================================
  max_timesteps:
    value: 200000

  # ===================================================================
  # REWARD — ANTI-OSCILLAZIONE / SMOOTHNESS (default: -10.0, -0.03, -8.0)
  # Guida principalmente obj_w_smooth (smoothness_mean, GLOBALE).
  # ===================================================================
  rew_scale_action_smoothness:
    values: [-13.0, -11.0, -10.0, -9.0, -7.0]

  rew_scale_reg_ang_vel_wz:
    values: [-0.045, -0.035, -0.03, -0.02]

  rew_scale_aggressive_cmd:
    values: [-10.0, -9.0, -8.0, -6.0, -5.0]

  # ===================================================================
  # REWARD — RETROMARCIA (default: -70.0)
  # Guida obj_w_rev (reverse_uniciclo_mean, SOLO UNICICLO).
  # ===================================================================
  rew_scale_reverse_vx:
    values: [-90.0, -80.0, -70.0, -60.0, -50.0]

  # ===================================================================
  # REWARD — VY UNICICLO, riferimento E reale (default: -300.0, -150.0)
  # Guida obj_w_vy_ref e obj_w_vy_real (SOLO UNICICLO).
  # ===================================================================
  rew_scale_vy_penalty_uniciclo:
    values: [-400.0, -350.0, -300.0, -250.0, -200.0]

  rew_scale_vy_real_penalty_uniciclo:
    values: [-200.0, -175.0, -150.0, -125.0, -100.0]

  # ===================================================================
  # REWARD — ANTI-OVERSHOOT / GATE YAW UNICICLO (default: -15.0, 0.5, 0.18)
  # Contribuiscono indirettamente a error_mean (globale) e alla dinamica
  # di avvicinamento dell'uniciclo.
  # ===================================================================
  rew_scale_approach_brake:
    values: [-20.0, -17.0, -15.0, -12.0]

  approach_brake_dist:
    values: [0.4, 0.5, 0.6]

  yaw_gate_dist_uniciclo:
    values: [0.14, 0.18, 0.22]

# =======================================================================
# COMANDO DI LANCIO
# =======================================================================
# PPO, architettura di rete, e i pesi obj_* (fissi, vedi cfg) NON compaiono
# qui di proposito. Se in futuro si vuole allargare lo sweep anche a
# posizione/yaw base (rew_scale_position_approach, rew_scale_yaw_error,
# ecc.) o a PPO/architettura, aggiungerli come nuovi blocchi "parameters"
# seguendo lo stesso schema (values centrati sui default, CLI arg gia'
# presente in train_manual.py per quelli reward).
command:
  - ${env}
  - /workspace/isaaclab/_isaac_sim/python.sh
  - ${program}
  - ${args}
  - --task
  - Template-Project-Favuzzi-Mutasci-PosController-Direct-v0
  - --headless
  - --wandb_sweep
  - --experiment_name
  - POS_SWEEP_GLOBAL_V1